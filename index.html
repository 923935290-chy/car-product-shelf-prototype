<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>车品商品上下架交互原型</title>
  <style>
    :root{--primary:oklch(58% .19 259);--primary-soft:oklch(96% .025 259);--danger:oklch(61% .22 25);--success:oklch(58% .15 145);--warning:oklch(72% .15 75);--canvas:oklch(97% .006 255);--surface:oklch(99.5% .003 255);--text:oklch(27% .02 255);--muted:oklch(56% .018 255);--line:oklch(90% .01 255);--shadow:0 12px 34px rgb(29 43 68 / .15)}
    *{box-sizing:border-box}body{margin:0;color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--canvas)}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}:focus-visible{outline:3px solid oklch(75% .13 259 / .35);outline-offset:2px}
    .app{min-width:1180px;min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:188px;background:var(--surface);border-right:1px solid var(--line);z-index:4}.brand{height:58px;display:flex;align-items:center;padding:0 20px;font-size:17px;font-weight:700}.group{padding:15px 20px 7px;color:var(--muted);font-size:12px}.nav{padding:0 10px}.nav a{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:6px;color:var(--text);text-decoration:none}.nav a.active{color:var(--primary);background:var(--primary-soft);font-weight:650}.dot{width:14px;text-align:center;color:var(--muted)}
    main{margin-left:188px;padding:20px 24px 44px}.crumb{height:30px;color:var(--muted)}.crumb b{color:var(--text)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px}.panel-title{font-size:16px;font-weight:700}.filter-grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:14px 18px;padding:0 20px 18px}.field label{display:block;margin-bottom:6px;font-weight:560}.control{width:100%;height:36px;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:0 11px}.control:hover{border-color:oklch(73% .1 259)}.actions{grid-column:1/-1;display:flex;gap:10px;padding-top:2px}.btn{height:36px;border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:0 17px;font-weight:560}.btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}.btn.primary{color:oklch(99% .005 255);background:var(--primary);border-color:var(--primary)}.btn.danger{color:oklch(99% .005 25);background:var(--danger);border-color:var(--danger)}.btn.ghost{border-color:transparent;background:transparent;color:var(--primary);padding:0 8px}.btn.sm{height:30px;padding:0 12px;font-size:13px}
    .result-panel{overflow:hidden}.toolbar{display:flex;align-items:center;min-height:52px;padding:8px 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);gap:10px}.selected{font-weight:650;color:var(--primary);margin-right:4px}.toolbar .spacer{flex:1}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:13px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{background:oklch(98% .006 255);color:oklch(38% .018 255);font-weight:650}th:first-child,td:first-child{padding-left:20px;width:44px}tbody tr:hover{background:oklch(98.5% .01 259)}input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary)}.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:4px;font-weight:600}.tag.up{color:oklch(46% .14 145);background:oklch(94% .04 145)}.tag.down{color:oklch(52% .14 65);background:oklch(95% .045 75)}.tag.fail{color:var(--danger);background:oklch(95% .035 25)}.links{display:flex;gap:10px}.link{padding:0;border:0;background:none;color:var(--primary)}.link.danger-link{color:var(--danger)}.pagination{display:flex;align-items:center;justify-content:flex-end;gap:7px;padding:16px 20px}.page{width:30px;height:30px;border:1px solid transparent;background:transparent;border-radius:4px}.page.active{color:oklch(99% .005 255);background:var(--primary)}
    .overlay{position:fixed;inset:0;background:rgb(24 31 45 / .46);display:none;align-items:center;justify-content:center;z-index:20}.overlay.open{display:flex}.modal{width:min(520px,calc(100vw - 48px));background:var(--surface);border-radius:9px;box-shadow:var(--shadow);animation:rise .18s cubic-bezier(.22,1,.36,1)}@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:18px}.close{width:30px;height:30px;border:0;background:transparent;border-radius:4px;font-size:20px;color:var(--muted)}.modal-body{padding:20px 22px}.warning{padding:12px 14px;border:1px solid oklch(88% .07 75);border-radius:5px;background:oklch(97% .035 75);margin-bottom:18px}.required{color:var(--danger)}.modal .field{margin-top:15px}.error{min-height:20px;color:var(--danger);font-size:12px;margin-top:3px}.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:15px 22px;border-top:1px solid var(--line)}
    .toast-stack{position:fixed;top:18px;right:22px;z-index:40;display:grid;gap:10px}.toast{min-width:340px;max-width:460px;padding:13px 15px;border:1px solid var(--line);border-radius:7px;background:var(--surface);box-shadow:0 8px 25px rgb(29 43 68 / .14);display:flex;align-items:flex-start;gap:10px;animation:slide .2s cubic-bezier(.22,1,.36,1)}@keyframes slide{from{opacity:0;transform:translateX(16px)}}.toast-icon{font-weight:800;color:var(--success)}.toast.error-toast .toast-icon{color:var(--danger)}.toast-text{flex:1}.toast-title{font-weight:700}.toast-detail{color:var(--muted);font-size:13px;margin-top:2px}.toast-link{border:0;background:none;padding:0;color:var(--primary);font-weight:600}.fail-list{margin:0;padding:0;list-style:none}.fail-list li{padding:11px 0;border-bottom:1px solid var(--line)}.fail-list li:last-child{border-bottom:0}.fail-name{font-weight:650}.fail-reason{color:var(--danger);font-size:13px;margin-top:3px}.empty{text-align:center;padding:52px 20px;color:var(--muted)}
    @media(max-width:1300px){.filter-grid{grid-template-columns:repeat(3,minmax(180px,1fr))}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar"><div class="brand">洗车</div><div class="nav"><a href="#"><span class="dot">≡</span>商品管理</a><a href="#"><span class="dot">≡</span>门店管理</a><a href="#"><span class="dot">≡</span>订单管理</a></div><div class="group">车险</div><div class="nav"><a href="#"><span class="dot">≡</span>订单列表</a></div><div class="group">严选车品</div><div class="nav"><a class="active" href="#"><span class="dot">≡</span>商品管理</a><a href="#"><span class="dot"></span>商品组管理</a><a href="#"><span class="dot">≡</span>商品展示管理</a><a href="#"><span class="dot">≡</span>订单管理</a><a href="#"><span class="dot">≡</span>商品活动管理</a></div></aside>
  <main>
    <div class="crumb">严选车品 / 商品管理 / <b>商品管理</b></div>
    <section class="panel"><div class="panel-head"><div class="panel-title">筛选项</div></div><div class="filter-grid">
      <div class="field"><label for="idFilter">商品ID</label><input id="idFilter" class="control" placeholder="请输入查询的商品ID"></div>
      <div class="field"><label for="titleFilter">商品标题</label><input id="titleFilter" class="control" placeholder="请输入商品标题"></div>
      <div class="field"><label>商品短标题</label><input class="control" placeholder="请输入商品短标题"></div>
      <div class="field"><label>商户ID</label><input class="control" placeholder="请输入商户PID"></div>
      <div class="field"><label for="merchantFilter">商户名称</label><input id="merchantFilter" class="control" placeholder="请输入查询的商户名称"></div>
      <div class="field"><label>售价</label><input class="control" placeholder="最低价 ～ 最高价"></div>
      <div class="field"><label>新建时间</label><input class="control" placeholder="开始日期 → 结束日期"></div>
      <div class="field"><label>商品品类</label><select class="control"><option>请选择商品品类</option><option>汽车用品</option><option>食品饮料</option></select></div>
      <div class="field"><label for="auditFilter">准售审核状态</label><select id="auditFilter" class="control"><option value="">全部</option><option value="审核通过">审核通过</option><option value="审核不通过">审核不通过</option></select></div>
      <div class="field"><label for="statusFilter">发布状态</label><select id="statusFilter" class="control"><option value="">全部</option><option value="已发布">已发布</option><option value="已下架">已下架</option></select></div>
      <div class="actions"><button class="btn primary" id="searchBtn">查询</button><button class="btn" id="resetBtn">重置</button></div>
    </div></section>
    <section class="panel result-panel"><div class="panel-head"><div class="panel-title">筛选结果</div><button class="btn primary" id="exportBtn">商品导出</button></div><div class="toolbar"><span class="selected" id="selectedText">已选择 0 件商品</span><button class="btn primary sm" id="bulkUp" disabled>批量上架</button><button class="btn danger sm" id="bulkDown" disabled>批量下架</button><span class="spacer"></span><button class="btn ghost" id="clearSelection" disabled>取消选择</button></div><div class="table-wrap"><table><thead><tr><th><input type="checkbox" id="checkAll" aria-label="全选当前页"></th><th>商户名称</th><th>售价</th><th>剩余库存</th><th>新建时间</th><th>商品品类</th><th>服务费率</th><th>准售审核状态</th><th>发布状态</th><th>下架原因</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty" hidden>暂无符合条件的商品</div></div><div class="pagination"><span id="totalText">共 0 条</span><button class="page">‹</button><button class="page active">1</button><button class="page">2</button><button class="page">3</button><span>…</span><button class="page">13</button><button class="page">›</button></div></section>
  </main>
</div>
<div class="toast-stack" id="toastStack" aria-live="polite"></div>
<div class="overlay" id="downOverlay" role="dialog" aria-modal="true" aria-labelledby="downTitle"><div class="modal"><div class="modal-head"><h2 id="downTitle">确认下架</h2><button class="close" data-close="downOverlay" aria-label="关闭">×</button></div><div class="modal-body"><div class="warning">⚠ 下架后商品将不再展示给用户，已创建的待支付订单仍可继续支付。确认下架？</div><div class="field"><label><span class="required">*</span> 下架原因（必填）</label><select id="reason" class="control"><option value="">请选择下架原因</option><option>缺货</option><option>清仓</option><option>违规</option><option>其他</option></select><div class="error" id="reasonError"></div></div></div><div class="modal-foot"><button class="btn" data-close="downOverlay">取消</button><button class="btn danger" id="confirmDown">确认下架</button></div></div></div>
<div class="overlay" id="failOverlay" role="dialog" aria-modal="true" aria-labelledby="failTitle"><div class="modal"><div class="modal-head"><h2 id="failTitle">未成功商品</h2><button class="close" data-close="failOverlay">×</button></div><div class="modal-body"><ul id="failList" class="fail-list"></ul></div><div class="modal-foot"><button class="btn primary" data-close="failOverlay">知道了</button></div></div></div>
<div class="overlay" id="logOverlay" role="dialog" aria-modal="true" aria-labelledby="logTitle"><div class="modal"><div class="modal-head"><h2 id="logTitle">操作日志</h2><button class="close" data-close="logOverlay">×</button></div><div class="modal-body" id="logBody"></div><div class="modal-foot"><button class="btn primary" data-close="logOverlay">关闭</button></div></div></div>
<script>
  const products=[
    {id:'CP26031601',title:'车载多功能收纳箱',merchant:'ESCASE车品旗舰店',price:'¥16.8 ～ ¥49',stock:2999,time:'2026/03/16 16:48:02',category:'无券类-无券类20%',fee:'20%',audit:'审核通过',status:'已发布',reason:'—',valid:true,logs:[['发布','采销-王程','2026/03/16 16:50:10']]},
    {id:'CP26031602',title:'汽车玻璃清洁剂',merchant:'ESCASE车品旗舰店',price:'¥8.9 ～ ¥99',stock:3497,time:'2026/03/16 16:47:13',category:'无券类-无券类20%',fee:'20%',audit:'审核通过',status:'已发布',reason:'—',valid:true,logs:[['发布','采销-王程','2026/03/16 16:49:30']]},
    {id:'CP26031001',title:'车载矿泉水组合装',merchant:'米果车品精选店',price:'¥6.9 ～ ¥18.9',stock:0,time:'2026/03/10 09:22:35',category:'无券类-无券类20%',fee:'20%',audit:'审核通过',status:'已下架',reason:'缺货',valid:true,logs:[['下架（缺货）','采销-马晓兵','2026/11/16 15:08:20']]},
    {id:'CP26030807',title:'车用应急工具套装',merchant:'车品铺子',price:'¥49 ～ ¥119',stock:1520,time:'2026/03/08 14:11:50',category:'无券类-无券类20%',fee:'20%',audit:'审核通过',status:'已下架',reason:'违规',valid:false,invalidReason:'商品被平台限制销售',logs:[['下架（违规）','采销-王玉垚','2026/11/15 10:18:06']]},
    {id:'CP26030703',title:'汽车脚垫通用款',merchant:'驾享优品车品店',price:'¥29 ～ ¥199',stock:860,time:'2026/03/07 10:26:32',category:'无券类-无券类20%',fee:'20%',audit:'审核不通过',status:'已下架',reason:'其他',valid:false,invalidReason:'准售审核未通过',logs:[['下架（其他）','采销-王程','2026/11/12 12:03:18']]}
  ];
  let visible=[...products],selected=new Set(),pendingDown=[],lastFailures=[];
  const $=s=>document.querySelector(s),tbody=$('#tbody');
  function render(){tbody.innerHTML='';visible.forEach(p=>{const tr=document.createElement('tr');tr.innerHTML=`<td><input type="checkbox" class="row-check" data-id="${p.id}" ${selected.has(p.id)?'checked':''} aria-label="选择${p.merchant}"></td><td>${p.merchant}<div style="color:var(--muted);font-size:12px">${p.id}</div></td><td>${p.price}</td><td>${p.stock}</td><td>${p.time}</td><td>${p.category}</td><td>${p.fee}</td><td>${p.audit}</td><td><span class="tag ${p.status==='已发布'?'up':'down'}">${p.status}</span></td><td>${p.reason}</td><td><div class="links"><button class="link" data-action="view" data-id="${p.id}">查看</button><button class="link" data-action="edit" data-id="${p.id}">编辑</button><button class="link" data-action="log" data-id="${p.id}">日志</button><button class="link ${p.status==='已发布'?'danger-link':''}" data-action="${p.status==='已发布'?'down':'up'}" data-id="${p.id}">${p.status==='已发布'?'下架':'上架'}</button></div></td>`;tbody.appendChild(tr)});$('#empty').hidden=visible.length>0;$('#totalText').textContent=`共 ${visible.length} 条`;syncSelection()}
  function syncSelection(){const checks=[...document.querySelectorAll('.row-check')];checks.forEach(c=>c.checked=selected.has(c.dataset.id));$('#selectedText').textContent=`已选择 ${selected.size} 件商品`;$('#bulkUp').disabled=!selected.size;$('#bulkDown').disabled=!selected.size;$('#clearSelection').disabled=!selected.size;$('#checkAll').checked=checks.length>0&&checks.every(c=>c.checked);$('#checkAll').indeterminate=checks.some(c=>c.checked)&&!checks.every(c=>c.checked)}
  function toast(title,detail='',error=false,withLink=false){const el=document.createElement('div');el.className='toast'+(error?' error-toast':'');el.innerHTML=`<span class="toast-icon">${error?'!':'✓'}</span><div class="toast-text"><div class="toast-title">${title}</div>${detail?`<div class="toast-detail">${detail}</div>`:''}</div>${withLink?'<button class="toast-link">查看失败原因</button>':''}`;if(withLink)el.querySelector('.toast-link').onclick=()=>openOverlay('failOverlay');$('#toastStack').appendChild(el);setTimeout(()=>el.remove(),5200)}
  function openOverlay(id){$('#'+id).classList.add('open');setTimeout(()=>$('#'+id).querySelector('button,select,input')?.focus(),30)}function closeOverlay(id){$('#'+id).classList.remove('open')}
  function openDown(ids){pendingDown=ids;$('#reason').value='';$('#reasonError').textContent='';openOverlay('downOverlay')}
  function runUp(ids){let success=0,skipped=0;lastFailures=[];ids.forEach(id=>{const p=products.find(x=>x.id===id);if(p.status==='已发布'){skipped++;return}if(!p.valid){lastFailures.push({name:p.merchant,id:p.id,reason:p.invalidReason});return}p.status='已发布';p.reason='—';p.logs.unshift(['上架','当前操作账号',new Date().toLocaleString('zh-CN',{hour12:false})]);success++});selected.clear();render();if(lastFailures.length){fillFailures();toast(`批量操作完成：成功 ${success} 件，失败 ${lastFailures.length} 件`,skipped?`${skipped} 件已发布，已跳过`:'' ,true,true)}else toast(`成功上架 ${success} 件`,skipped?`${skipped} 件已发布，已跳过`:'')}
  function fillFailures(){$('#failList').innerHTML=lastFailures.map(f=>`<li><div class="fail-name">${f.name}（${f.id}）</div><div class="fail-reason">${f.reason}</div></li>`).join('')}
  document.addEventListener('change',e=>{if(e.target.classList.contains('row-check')){e.target.checked?selected.add(e.target.dataset.id):selected.delete(e.target.dataset.id);syncSelection()}if(e.target.id==='checkAll'){document.querySelectorAll('.row-check').forEach(c=>e.target.checked?selected.add(c.dataset.id):selected.delete(c.dataset.id));syncSelection()}});
  document.addEventListener('click',e=>{const close=e.target.dataset.close;if(close)closeOverlay(close);const action=e.target.dataset.action,id=e.target.dataset.id;if(!action)return;const p=products.find(x=>x.id===id);if(action==='down')openDown([id]);if(action==='up')runUp([id]);if(action==='log'){const rows=p.logs.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('');$('#logBody').innerHTML=`<div style="margin-bottom:12px"><b>${p.merchant}</b>（${p.id}）</div><table><thead><tr><th>编辑类型</th><th>编辑账号</th><th>修改时间</th></tr></thead><tbody>${rows}</tbody></table>`;openOverlay('logOverlay')}if(action==='view'||action==='edit')toast(`${action==='view'?'查看':'编辑'}页面不在本次原型范围内`,'本入口仅用于展示完整操作路径')});
  $('#bulkDown').onclick=()=>openDown([...selected]);$('#bulkUp').onclick=()=>runUp([...selected]);$('#clearSelection').onclick=()=>{selected.clear();syncSelection()};
  $('#confirmDown').onclick=()=>{const reason=$('#reason').value;if(!reason){$('#reasonError').textContent='请选择下架原因';$('#reason').focus();return}let success=0,skipped=0;pendingDown.forEach(id=>{const p=products.find(x=>x.id===id);if(p.status==='已下架'){skipped++;return}p.status='已下架';p.reason=reason;p.logs.unshift([`下架（${reason}）`,'当前操作账号',new Date().toLocaleString('zh-CN',{hour12:false})]);success++});closeOverlay('downOverlay');selected.clear();render();toast(`成功下架 ${success} 件`,skipped?`${skipped} 件已下架，已跳过`:'')};
  $('#searchBtn').onclick=()=>{const id=$('#idFilter').value.trim().toLowerCase(),title=$('#titleFilter').value.trim().toLowerCase(),merchant=$('#merchantFilter').value.trim().toLowerCase(),audit=$('#auditFilter').value,status=$('#statusFilter').value;visible=products.filter(p=>(!id||p.id.toLowerCase().includes(id))&&(!title||p.title.toLowerCase().includes(title))&&(!merchant||p.merchant.toLowerCase().includes(merchant))&&(!audit||p.audit===audit)&&(!status||p.status===status));selected.clear();render();toast(`查询完成，共 ${visible.length} 条结果`)};
  $('#resetBtn').onclick=()=>{document.querySelectorAll('.filter-grid input').forEach(x=>x.value='');document.querySelectorAll('.filter-grid select').forEach(x=>x.selectedIndex=0);visible=[...products];selected.clear();render()};$('#exportBtn').onclick=()=>toast('导出任务已创建','原型不生成实际文件');
  document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay.open').forEach(x=>x.classList.remove('open'))});document.querySelectorAll('.overlay').forEach(x=>x.addEventListener('click',e=>{if(e.target===x)closeOverlay(x.id)}));
  render();
</script>
</body>
</html>
